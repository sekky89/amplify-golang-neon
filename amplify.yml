version: 1
backend:
  phases:
    preBuild:
      commands:
        - sudo yum -y upgrade && sudo yum -y install golang
        - mkdir ~/go_proj
        - export PATH=$PATH:/usr/local/go/bin
        - export GOPATH=$HOME/go_proj
        - export GOBIN=$GOPATH/bin
    build:
      commands:
        - corepack enable
        - pnpm install --frozen-lockfile

        - pnpm exec ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - pnpm run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
