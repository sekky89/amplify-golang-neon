version: 1
backend:
  phases:
    preBuild:
      commands:
        - curl -fsSL https://golang.org/dl/go1.25.6.linux-amd64.tar.gz | sudo tar -C /usr/local -xz
        - mkdir ~/go_proj
        - export PATH=$PATH:/usr/local/go/bin
        - export GOPATH=$HOME/go_proj
        - export GOBIN=$GOPATH/bin
    build:
      commands:
        - corepack enable
        - pnpm install --frozen-lockfile

        - pnpm exec ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - pnpm run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
